name: Secret Scanning
on:
  pull_request:
  push:
    branches: [main, dev]
jobs:
  gitleaks:
    name: Gitleaks
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Scan
        uses: gitleaks/gitleaks-action@v2
