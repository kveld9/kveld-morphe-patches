name: 🐞 Bug report
description: Report a bug or an issue.
title: "bug: "
labels: ["Bug report"]
body:
  - type: markdown
    attributes:
      value: |
        # Morphe Patches bug report

        Before creating a new bug report, please keep the following in mind:

        - **Do not submit a duplicate bug report**: Search for existing bug reports [here](https://github.com/kveld9/kveld-morphe-patches/issues?q=label%3A%22Bug+report%22).
        - **Review existing issues**: Make sure your bug report includes all requested information.
  - type: dropdown
    id: app
    attributes:
      label: Target App
      description: Which app are you reporting an issue for?
      options:
        - Brave Browser
        - Gboard Lite
        - Vivaldi Browser Snapshot
        - Universal / Other
    validations:
      required: true
  - type: textarea
    id: bug-description
    attributes:
      label: Bug description
      description: |
        - Describe your bug or unexpected behavior in detail.
        - Exact APK filename and architecture (e.g. `Bravemonoarm64.apk`, `Gboard_v18.0.3_arm64-v8a.apk`, `Vivaldi.8.2.4143.3.apk`).
        - Steps to reproduce the issue (Step 1. ... Step 2. ...).
    validations:
      required: true
  - type: textarea
    id: patcher-log
    attributes:
      label: Morphe Manager Patching Log
      description: |
        Paste the FULL patching log copied from Morphe Manager (tap the copy/share icon after patching).
        This must include the header (`[INFO] Build: ...`, `[INFO] Device: ...`), version, selected patches, and all `[WARN] [STDIO]: [...]` lines.
      placeholder: |
        [INFO] Build: manager=1.29.0 patcher=1.11.0 nativeLibs=true
        [INFO] Device: android=16 api=36 ...
        [INFO] Patching started at ...
        ...
      render: shell
    validations:
      required: true
  - type: textarea
    id: runtime-logcat
    attributes:
      label: Runtime Crash Logcat (Optional)
      description: If the patched app crashes on launch or runtime, capture and paste the crash exception log (`logcat | grep AndroidRuntime` or system crash dump).
      render: shell
  - type: textarea
    id: additional-context
    attributes:
      label: Additional context
      description: Add any other context, screenshots, or screen recordings here.
  - type: checkboxes
    id: acknowledgements
    attributes:
      label: Acknowledgements
      description: Your bug report will be closed if you don't follow the checklist below.
      options:
        - label: I have checked all open and closed bug reports and this is not a duplicate.
          required: true
        - label: I have chosen an appropriate title.
          required: true
        - label: All requested information and full Morphe Manager patching logs have been provided.
          required: true
